name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jaydeepbagda13
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a855f7

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
